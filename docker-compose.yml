services:
  icloud-cruncher:
    container_name: icloud-cruncher-mcp
    stop_grace_period: 45s
    build: .
    ports:
      # Keep the write-capable MCP endpoint local. The tunnel reaches it over
      # the private Compose network; do not bind this to 0.0.0.0 without auth.
      - "127.0.0.1:8080:8080"
    volumes:
      - icloud-cache:/data
    environment:
      ICLOUD_USERNAME: ${ICLOUD_USERNAME:-}
      ICLOUD_APP_PASSWORD: ${ICLOUD_APP_PASSWORD:-}
      ICLOUD_DEFAULT_CALENDAR: ${ICLOUD_DEFAULT_CALENDAR:-}
      ICLOUD_TIMEZONE: ${ICLOUD_TIMEZONE:-Europe/Berlin}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_APP_PASSWORD: ${IMAP_APP_PASSWORD:-}
      IMAP_HOST: ${IMAP_HOST:-imap.mail.me.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_DEFAULT_MAILBOX: ${IMAP_DEFAULT_MAILBOX:-INBOX}
      IMAP_DRAFTS_MAILBOX: ${IMAP_DRAFTS_MAILBOX:-Drafts}
      IMAP_EMAIL_CACHE_TTL_SECONDS: ${IMAP_EMAIL_CACHE_TTL_SECONDS:-300}
      IMAP_EMAIL_CONTENT_TTL_SECONDS: ${IMAP_EMAIL_CONTENT_TTL_SECONDS:-86400}
      IMAP_MAILBOX_CACHE_TTL_SECONDS: ${IMAP_MAILBOX_CACHE_TTL_SECONDS:-1800}
      IMAP_EMAIL_CACHE_DAYS: ${IMAP_EMAIL_CACHE_DAYS:-100}
      IMAP_EMAIL_CACHE_MAX_MESSAGES: ${IMAP_EMAIL_CACHE_MAX_MESSAGES:-1000}
      IMAP_CONNECTION_POOL_SIZE: ${IMAP_CONNECTION_POOL_SIZE:-4}
      IMAP_EMAIL_CACHE_CRAWL_ENABLED: ${IMAP_EMAIL_CACHE_CRAWL_ENABLED:-true}
      IMAP_EMAIL_CACHE_CRAWL_BATCH_SIZE: ${IMAP_EMAIL_CACHE_CRAWL_BATCH_SIZE:-25}
      IMAP_EMAIL_CACHE_CRAWL_INTERVAL_SECONDS: ${IMAP_EMAIL_CACHE_CRAWL_INTERVAL_SECONDS:-0.1}
      IMAP_EMAIL_CACHE_MAX_MESSAGE_BYTES: ${IMAP_EMAIL_CACHE_MAX_MESSAGE_BYTES:-25000000}
      # Optional Go Reminders backend, enabled with the reminders profile.
      REMINDERS_MCP_URL: ${REMINDERS_MCP_URL:-}
      REMINDERS_MCP_TOKEN: ${REMINDERS_MCP_TOKEN:-}
      REMINDERS_MCP_TIMEOUT_SECONDS: ${REMINDERS_MCP_TIMEOUT_SECONDS:-210}
      # Optional semantic search. Only extracted text is embedded; Qdrant stays local.
      MAIL_SEARCH_ENABLED: ${MAIL_SEARCH_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      # Empty means the selected model's default dimension (3072 / 1536).
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-icloud-mail}
      MAIL_SEARCH_EMBEDDING_MODE: ${MAIL_SEARCH_EMBEDDING_MODE:-batch}
      MAIL_SEARCH_BATCH_SIZE: ${MAIL_SEARCH_BATCH_SIZE:-100}
      MAIL_SEARCH_POLL_SECONDS: ${MAIL_SEARCH_POLL_SECONDS:-30}
      # Persistent MCP read cache. Events default to 60 seconds, calendars to 300.
      ICLOUD_CACHE_PATH: /data/icloud-calendar-cache.sqlite3
      ICLOUD_CACHE_TTL_SECONDS: ${ICLOUD_CACHE_TTL_SECONDS:-60}
      ICLOUD_CALENDARS_CACHE_TTL_SECONDS: ${ICLOUD_CALENDARS_CACHE_TTL_SECONDS:-300}
      ICLOUD_CACHE_REFRESH_ENABLED: ${ICLOUD_CACHE_REFRESH_ENABLED:-true}
      ICLOUD_CACHE_REFRESH_INTERVAL_SECONDS: ${ICLOUD_CACHE_REFRESH_INTERVAL_SECONDS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # OpenAI Secure MCP Tunnel keeps the MCP server private. It makes an
  # outbound-only connection to OpenAI and forwards requests to /mcp.
  openai-tunnel:
    image: ghcr.io/openai/tunnel-client:${TUNNEL_CLIENT_VERSION:-v0.0.15}
    depends_on:
      icloud-cruncher:
        condition: service_healthy
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:-}
      MCP_SERVER_URL: http://icloud-cruncher:8080/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: :8081
    restart: unless-stopped

  # Build the separately maintained Go project at a fixed, reviewed commit.
  # No published ports: only Python connects to its private MCP endpoint.
  reminders:
    profiles: ["reminders"]
    build:
      context: ${REMINDERS_BUILD_CONTEXT:-https://github.com/Tooker/icloud-reminders-cli.git#a0a3da50f288d6fc519c9c7eeee6ec0b1272c422}
    volumes:
      - reminders-data:/data
    environment:
      REMINDERS_MCP_TOKEN: ${REMINDERS_MCP_TOKEN:-}
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  # No published ports: access is limited to the private Compose network.
  # Start with: docker compose --profile search up -d qdrant
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.1}
    profiles: ["search"]
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__TELEMETRY_DISABLED: "true"
    restart: unless-stopped

volumes:
  icloud-cache:
  qdrant-storage:
  reminders-data:
