[project]
name = "icloud-cruncher"
version = "1.3.0"
description = "MCP server for iCloud Calendar, Mail, Contacts, Drive and Reminders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "caldav>=3.3.1",
    "cryptography>=46,<51",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "httpx2>=2.13.1,<3",
    "loguru>=0.7.3",
    "mcp>=2.2.0",
    "pypdf[fonts]>=6.19.0,<7",
    "pyyaml>=6.0.2",
    "recurring-ical-events>=3.8.2,<4",
    "uvicorn[standard]>=0.30.0",
    "vobject>=0.9.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: accesses the configured external iCloud service; opt-in only",
]
