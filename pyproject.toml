[project]
name = "icloud-cruncher"
version = "0.1.0"
description = "Stateless iCloud calendar forwarding proxy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
