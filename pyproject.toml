[project]
name = "icloud-cruncher"
version = "0.1.0"
description = "iCloud calendar proxy and read/write MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "caldav>=3.3.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "mcp>=2.2.0",
    "pypdf[fonts]>=6.19.0,<7",
    "pyyaml>=6.0.2",
    "recurring-ical-events>=3.8.2,<4",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: accesses the configured external iCloud service; opt-in only",
]
