# Optional local configuration. Docker Compose uses .env by default.
# Read/write iCloud Calendar access for the MCP endpoint.
# Use an Apple app-specific password, not the primary Apple Account password.
# This block can be replaced by the ICLOUD_* environment variables documented
# in README.md, which is recommended for Docker.
icloud:
  username: "your-apple-id@example.com"
  app_specific_password: "xxxx-xxxx-xxxx-xxxx"
  caldav_url: "https://caldav.icloud.com/"
  # Name or id from list_calendars. Leave null when the account has one calendar.
  default_calendar: null
  timezone: "Europe/Berlin"

# iCloud Contacts reuse the icloud credentials. Dedicated username and
# app_specific_password fields can override them, like CARDDAV_* variables.
contacts:
  carddav_url: "https://contacts.icloud.com/"
  # Exact ID from list_addressbooks; no display names or remote URLs.
  default_addressbook: null
  timeout_seconds: 60
  max_contacts: 5000

# iCloud Mail uses the same Apple Account credentials by default. Dedicated
# IMAP_USERNAME and IMAP_APP_PASSWORD environment variables can override them.
imap:
  host: "imap.mail.me.com"
  port: 993
  default_mailbox: "INBOX"
